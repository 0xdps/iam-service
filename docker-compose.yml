# Main Docker Compose file - Full Stack by default
# Use this file for standard development and testing
#
# Alternative compose files:
# - docker-compose.full.yml      Complete system (Backend + Frontend + Databases)
# - docker-compose.backend.yml   Backend services only (Auth + IAM + Databases)
# - docker-compose.frontend.yml  Frontend service only
# - docker-compose.dev.yml       Development infrastructure only (Databases + Redis)
#
# Usage examples:
# make run-full          -> Uses docker-compose.full.yml
# make run-backend       -> Uses docker-compose.backend.yml
# make run-frontend      -> Uses docker-compose.frontend.yml
# make docker-up         -> Uses docker-compose.dev.yml (this file)

version: '3.8'

services:
  # Development Infrastructure Only
  # This is optimized for local development where you run services manually
  
  # Databases
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db-dev
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    volumes:
      - auth_data_dev:/var/lib/postgresql/data
      - ./auth/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - iam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  iam-db:
    image: postgres:15-alpine
    container_name: iam-db-dev
    environment:
      POSTGRES_DB: iamdb
      POSTGRES_USER: iamuser
      POSTGRES_PASSWORD: iampass
    volumes:
      - iam_data_dev:/var/lib/postgresql/data
      - ./iam/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - iam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamuser -d iamdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    command: redis-server --appendonly yes --loglevel verbose
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - iam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  auth_data_dev:
    driver: local
  iam_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  iam-network:
    driver: bridge
    labels:
      - "project=iam-service"
      - "environment=development"